[project]
name = "release-bot"
version = "0.0.1"
requires-python = "~=3.12.0"
dependencies = [
    "aiogram~=3.30.0",
    "alembic~=1.18.4",
    "apscheduler~=3.11.3",
    "fastapi[standard-no-fastapi-cloud-cli]~=0.139.2",
    "pydantic-settings~=2.14.2",
    "pygithub~=2.9.0",
    "python-telegram-bot~=22.7",
    "requirements-parser~=0.11.0",
    "sqlalchemy[asyncio]~=2.0.48",
    "sulguk~=0.11.0",
    "telegramify-markdown==1.1.3",
    "urllib3~=2.6.3",
]

[dependency-groups]
dev = [
    "pytest~=9.0.3",
    "ruff~=0.15.22",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RET",
    "RUF",
    "ASYNC",
    "A",
    "PIE",
    "PT",
    "PTH",
    "ISC",
    "PERF",
    "FURB",
    "LOG",
    "G",
]
ignore = [
    "E501",
    "RUF001"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
